services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brightloop
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brightloop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop"]
      interval: 5s
      retries: 10
volumes:
  brightloop_data:
